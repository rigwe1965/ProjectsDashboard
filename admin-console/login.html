<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Projects Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#d9dde5;--accent:#2b4acb;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c26;--ink:#e8ebf2;--mute:#98a2b3;--line:#2a3140;--accent:#6c8cff;--bad:#ff7b72}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;margin:14px 0 4px;color:var(--mute)}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{min-height:20px;margin-top:12px;color:var(--bad);font-size:14px}
/* glass: the sign-in card floats over soft colour (same look as the public showcase) */
:root{--glass:rgba(255,255,255,.66);--glass-edge:rgba(255,255,255,.8)}
@media (prefers-color-scheme:dark){:root{--glass:rgba(24,28,38,.66);--glass-edge:rgba(255,255,255,.1)}}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 520px at 12% 14%,rgba(43,74,203,.26),transparent 70%),radial-gradient(480px 480px at 90% 10%,rgba(124,58,237,.2),transparent 70%),radial-gradient(540px 540px at 80% 92%,rgba(14,116,104,.2),transparent 70%)}
form{background:var(--glass);border-color:var(--glass-edge);box-shadow:0 18px 50px -24px rgba(16,19,26,.45);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
@media (prefers-reduced-transparency:reduce){form{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style></head><body>
<form id="f" autocomplete="on">
  <h1>Projects Dashboard</h1><p>Owner sign-in</p>
  <label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <label for="code">Authenticator code <span style="opacity:.7">(if you turned it on)</span></label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456">
  <div id="err" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  try {
    const r = await fetch('/login', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: f.password.value, code: f.code.value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) location.href = '/'; else err.textContent = j.error || 'Could not sign in.';
  } catch { err.textContent = 'Could not reach the console.'; }
  go.disabled = false;
});
</script></body></html>
