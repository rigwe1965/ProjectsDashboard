name: CI
on:
  push:
    branches: [main]
  pull_request:
# The workflow only reads the repository; nothing here needs to write to it.
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest   # where the dashboard runs day to day
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high   # fails on a known high-severity advisory in what ships
      - run: npm run lint
      - run: npm test
      - run: npm run showcase:build

  linux:
    runs-on: ubuntu-latest    # where the hosted version runs: Postgres store and the POSIX supervisor driver
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: pdtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:testpw@localhost:5432/pdtest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test                              # includes the Postgres contract tests
      - run: node tests/linux/driver-check.mjs     # real processes: start, status, stop on Linux
      - run: docker build -f deploy/Dockerfile -t projects-dashboard .
      - run: docker build -f deploy/Caddy.Dockerfile -t pd-caddy .

  # Looks for committed secrets in the whole history. Free for repositories owned by a personal account.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # on pull requests the action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Scans the two images this repository builds for known vulnerabilities. Fails on a CRITICAL one that has a fix available;
  # HIGH ones are listed in the log (fixing them is a base-image update, which Dependabot proposes).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile -t projects-dashboard .
      - run: docker build -f deploy/Caddy.Dockerfile -t pd-caddy .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: projects-dashboard
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: projects-dashboard
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pd-caddy
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
