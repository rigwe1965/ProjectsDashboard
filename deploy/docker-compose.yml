# Hosted setup: Postgres + demo gateway + admin console + Caddy (HTTPS), plus optional app containers.
#   cd deploy && cp .env.example .env     (fill it in)  &&  cp ../registry/apps.hosted.example.json ../registry/apps.hosted.json
#   docker compose up -d                       the dashboard
#   ./check-apps-env.sh && docker compose --profile apps up -d    ...plus the app containers (the check refuses empty secrets)
# See deploy/README.md. Local test without a domain: add  -f docker-compose.local.yml  (plain HTTP on :8080).
name: projects-dashboard

x-dashboard-env: &dashboard-env
  DASHBOARD_DB: postgres
  DATABASE_URL: postgres://dashboard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/dashboard
  DASHBOARD_REGISTRY: /app/registry/apps.hosted.json
  TRUSTED_PROXIES: 172.30.0.2          # Caddy's fixed address below: X-Forwarded-For is believed only from it
  # The console creates the demo links, the gateway serves them: both must know the public address.
  DEMO_BASE_HOST: ${DEMO_DOMAIN:?set DEMO_DOMAIN in deploy/.env}
  DEMO_SCHEME: https
  # The status check probes every demo's address at once. Node resolves host names on a pool of 4 threads, and a name that does not exist
  # (the registry's placeholder hosts) can take seconds to fail, which left the real demos' lookups waiting behind it and made them look down.
  UV_THREADPOOL_SIZE: "64"

# Container hardening for the two Node services: no privilege gain, no Linux capabilities, a read-only root filesystem
# (only /tmp and the /data volume are writable), and limits so one runaway process cannot take the host down.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  pids_limit: 256
  mem_limit: 512m
  cpus: 1.0

# The customer-facing demo containers: no privilege gain, no Linux capabilities, and limits so one runaway request (a huge upload, a
# decompression bomb) cannot take the host's memory or process table. (They keep a writable root: their images write to several folders.)
# Settings the CRM demo's containers share (the database logins differ and are set on each service).
x-crm-env: &crm-env
  NEXTAUTH_SECRET: ${CRM_AUTH_SECRET:-}
  NEXTAUTH_URL: ${DEMO_SCHEME:-https}://crm.${DEMO_DOMAIN}
  AUTH_URL: ${DEMO_SCHEME:-https}://crm.${DEMO_DOMAIN}
  AUTH_TRUST_HOST: "true"
  SEED_USER_PASSWORD: ${CRM_DEMO_PASSWORD:-}
  # Stand-ins for what production mode insists on. Nothing real is behind them: mail goes to a closed port inside the
  # container (so nothing is ever sent), rate limits live in the crm-demo-ratelimit service, and admins sign in without
  # two-step codes like the local demo. The MFA and cron keys are derived from CRM_AUTH_SECRET by the entrypoint.
  EMAIL_SERVER: smtp://127.0.0.1:2525
  EMAIL_FROM: "CRM Demo <noreply@crm-demo.invalid>"
  REQUIRE_ADMIN_MFA: "0"
  UPSTASH_REDIS_REST_URL: http://crm-demo-ratelimit:8079
  UPSTASH_REDIS_REST_TOKEN: ${CRM_AUTH_SECRET:-}

x-demo-limits: &demo-limits
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 256
  mem_limit: 768m
  cpus: 1.0                            # one runaway demo cannot take every core of the host

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # what the postgres entrypoint needs to set up its data folder and drop to the postgres user
    read_only: true                      # it writes only to its data volume and these two small folders
    tmpfs: ["/tmp:rw,nosuid,size=64m", "/var/run/postgresql:rw,nosuid,size=8m"]
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [db]

  # A backup of the dashboard's database every day, kept in the db_backups volume (the newest 14). Same image as the database, so pg_dump matches it.
  db-backup:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=16m"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    depends_on: { postgres: { condition: service_healthy } }
    entrypoint: ["sh", "/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: dashboard
      PGDATABASE: dashboard
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes: ["./db-backup.sh:/db-backup.sh:ro", "db_backups:/backups"]
    networks: [db]

  gateway:
    <<: *hardened
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: projects-dashboard
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *dashboard-env
      GATEWAY_BIND: 172.30.0.4        # only the edge address below: a demo container on its own network cannot connect to the gateway
      GATEWAY_PORT: "4300"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DEMO_BOOKING_URL: ${DEMO_BOOKING_URL:-}   # optional https address of your booking page: adds a "Book a call" link to the page a customer sees when opening a demo link
    volumes: ["../registry/apps.hosted.json:/app/registry/apps.hosted.json:ro", "gateway_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://172.30.0.4:4300/_pd/healthz"]
      interval: 15s
      timeout: 4s
      retries: 3
    networks:
      edge: { ipv4_address: 172.30.0.4 }
      db:
      app_imageapp:
      app_airfinder:
      app_claudeos:
      app_rmm:
      app_crm:
      app_cw:

  console:
    <<: *hardened
    image: projects-dashboard
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, gateway: { condition: service_started } }
    command: ["node", "admin-console/server.mjs"]
    environment:
      <<: *dashboard-env
      CONSOLE_PORT: "4100"
      ADMIN_BIND: 172.30.0.3           # only the edge address below, so no demo container can reach the console; a password must be set first (see README)
      ADMIN_ALLOWED_HOSTS: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in deploy/.env},127.0.0.1
      ADMIN_SCHEME: https
      ADMIN_DATA_KEY: ${ADMIN_DATA_KEY:?set ADMIN_DATA_KEY in deploy/.env (npm run console:auth -- gen-key)}   # encrypts the 2-step secret in the database
      ADMIN_APP_CONTROL: "off"          # no Docker access in here: Start, Stop and Log are hidden and refused (use docker compose)
      ADMIN_REQUIRE_TOTP: "1"          # the console refuses to listen beyond this machine until 2-step codes are enabled (see README)
      ADMIN_PUBLIC_URL: https://${ADMIN_DOMAIN}
      ADMIN_GATEWAY_HOST: 172.30.0.4   # the gateway binds only this edge address; the name "gateway" resolves elsewhere
      ADMIN_CTL_SOCKET: /run/pd-ctl/ctl.sock   # the host helper deploy/ctl/pd-ctl.py (Start/Stop/Restart/Log); inactive while PD_CTL_TOKEN is empty
      ADMIN_CTL_TOKEN: ${PD_CTL_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}          # email alerts through Resend: need RESEND_API_KEY and ALERT_EMAIL_TO; unset = off
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@facyke.com}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes: ["../registry/apps.hosted.json:/app/registry/apps.hosted.json:ro", "console_data:/data", "/run/pd-ctl:/run/pd-ctl"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: 127.0.0.1", "http://172.30.0.3:4100/_pd/healthz"]   # the console only answers the host names it is allowed to serve
      interval: 15s
      timeout: 4s
      retries: 3
    networks:
      edge: { ipv4_address: 172.30.0.3 }
      db:
      app_imageapp:
      app_airfinder:
      app_claudeos:
      app_rmm:
      app_crm:
      app_cw:

  caddy:
    build: { context: .., dockerfile: deploy/Caddy.Dockerfile }
    restart: unless-stopped
    depends_on: [gateway, console]
    ports: ["80:80", "443:443", "443:443/udp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]          # the only privilege it needs: listening on ports 80 and 443
    read_only: true                      # it writes only to its two volumes (certificates, config) and /tmp
    tmpfs: ["/tmp:rw,nosuid,size=16m"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in deploy/.env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      DEMO_DOMAIN: ${DEMO_DOMAIN}
    volumes: [caddy_data:/data, caddy_config:/config]
    networks:
      edge: { ipv4_address: 172.30.0.2 }

  # --- app containers (profile "apps"). Built from the app's own folder, which is only read, never modified.
  imageapp-demo:
    profiles: ["apps"]
    build:
      context: ${APPS_ROOT:-../..}/ImageApp
      dockerfile: ../${DASHBOARD_DIR:-ProjectsDashboard}/deploy/apps/imageapp/Dockerfile
    image: pd-imageapp
    container_name: pd-imageapp-demo     # the registry's "container" name
    restart: unless-stopped
    <<: *demo-limits
    read_only: true                      # the app cannot change its own code; it writes only to these two folders
    tmpfs: ["/tmp:rw,nosuid,size=256m", "/var/log/imageapp:rw,nosuid,uid=10001,gid=10001,size=32m"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5400/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [app_imageapp]

  airfinder-demo:
    profiles: ["apps"]
    build:
      context: ${APPS_ROOT:-../..}/Airfinder
      dockerfile: ../${DASHBOARD_DIR:-ProjectsDashboard}/deploy/apps/airfinder/Dockerfile
    image: pd-airfinder
    container_name: pd-airfinder-demo
    restart: unless-stopped
    <<: *demo-limits
    read_only: true                      # writes go to /tmp, the instance volume (database and its two log files) and /app/.claude
    tmpfs: ["/tmp:rw,nosuid,size=64m", "/app/.claude:rw,nosuid,uid=10001,gid=10001,size=8m"]
    environment:     # no mail account is set, so the demo never sends email
      SECRET_KEY: ${AIRFINDER_SECRET_KEY:-}
      JWT_SECRET: ${AIRFINDER_JWT_SECRET:-}
      SUPER_ADMIN_EMAIL: ${AIRFINDER_ADMIN_EMAIL:-demo@example.com}
      SUPER_ADMIN_PASSWORD: ${AIRFINDER_ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${DEMO_SCHEME:-https}://airfinder.${DEMO_DOMAIN}
    volumes: [airfinder_demo_data:/app/instance]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5200/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [app_airfinder]

  # ClaudeOS demo: one container runs the API (loopback only) and the Streamlit dashboard (see deploy/apps/claudeos/Dockerfile).
  # It may reach the internet (the AI assistant calls Anthropic), so its network is not internal; AI actions cost money: watch usage.
  claudeos-demo:
    profiles: ["apps"]
    build:
      context: ${APPS_ROOT:-../..}/ClaudeOS
      dockerfile: ../${DASHBOARD_DIR:-ProjectsDashboard}/deploy/apps/claudeos/Dockerfile
    image: pd-claudeos
    container_name: pd-claudeos-demo
    restart: unless-stopped
    <<: *demo-limits
    mem_limit: 1g
    read_only: true                      # writes go to /tmp, /home/app and the data volume (database, vector files, logs)
    tmpfs: ["/tmp:rw,nosuid,size=128m", "/home/app:rw,nosuid,uid=10001,gid=10001,size=32m"]
    environment:     # no mail account, no cloud sync, no memory import: nothing reaches a real system
      CLAUDEOS_SECRET_KEY: ${CLAUDEOS_SECRET_KEY:-}
      CLAUDEOS_DEMO_PASSWORD: ${CLAUDEOS_DEMO_PASSWORD:-}
      ANTHROPIC_API_KEY: ${CLAUDEOS_ANTHROPIC_API_KEY:-}
      ALLOWED_ORIGINS: ${DEMO_SCHEME:-https}://claudeos.${DEMO_DOMAIN}
      ANONYMIZED_TELEMETRY: "False"      # ChromaDB's usage ping: nothing should leave the demo, and its analytics call errors at start-up on this version
    volumes: [claudeos_demo_data:/app/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8601/_stcore/health', timeout=3); urllib.request.urlopen('http://127.0.0.1:5100/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [app_claudeos]

  # Remote Management (RMM) demo: its own Postgres and Redis (never shared), the API and the Streamlit dashboard, each from its own image
  # (deploy/apps/rmm/). No Celery worker, no mail, no agent can enrol (the API is only reachable inside the compose network), so scheduled
  # jobs, backups and email do not run. Every customer, device, alert and ticket is simulated (supervisor/demo-fixes/seed-rmm-demo.py).
  rmm-demo-db:
    profiles: ["apps"]
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    container_name: pd-rmm-demo-db
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=64m", "/var/run/postgresql:rw,nosuid,size=8m"]
    environment:
      POSTGRES_DB: rmm_demo
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${RMM_DB_PASSWORD:-}
    volumes: [rmm_demo_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm -d rmm_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    pids_limit: 256
    networks: [rmm_data]

  rmm-demo-cache:
    profiles: ["apps"]
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: pd-rmm-demo-cache
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/data:rw,nosuid,uid=999,gid=1000,size=32m"]
    # No saving to disk: the demo's Redis only holds rate-limit counters and caches, and a reset empties it anyway.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$RMM_REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      RMM_REDIS_PASSWORD: ${RMM_REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RMM_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    pids_limit: 64
    networks: [rmm_data]

  rmm-demo-api:
    profiles: ["apps"]
    build:
      context: ${APPS_ROOT:-../..}/RemoteManagementSystem
      dockerfile: ../${DASHBOARD_DIR:-ProjectsDashboard}/deploy/apps/rmm/Dockerfile
    image: pd-rmm-api
    container_name: pd-rmm-demo-api
    restart: unless-stopped
    <<: *demo-limits
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /app/screenshots:rw,nosuid,uid=10001,gid=10001,size=16m
      - /app/reports:rw,nosuid,uid=10001,gid=10001,size=16m
      - /app/backups:rw,nosuid,uid=10001,gid=10001,size=16m
      - /app/instance:rw,nosuid,uid=10001,gid=10001,size=8m
      - /home/app:rw,nosuid,uid=10001,gid=10001,size=16m
    depends_on:
      rmm-demo-db: { condition: service_healthy }
      rmm-demo-cache: { condition: service_healthy }
    environment:     # no SMTP, MQTT, MDM or payment settings: nothing reaches a real system
      FLASK_ENV: production   # debug off, secure cookies. The demo runs over HTTPS and the dashboard uses bearer tokens, not cookies
      DATABASE_URL: postgresql://rmm:${RMM_DB_PASSWORD:-}@rmm-demo-db:5432/rmm_demo
      REDIS_URL: redis://:${RMM_REDIS_PASSWORD:-}@rmm-demo-cache:6379/0
      CELERY_BROKER_URL: redis://:${RMM_REDIS_PASSWORD:-}@rmm-demo-cache:6379/0
      CELERY_RESULT_BACKEND: redis://:${RMM_REDIS_PASSWORD:-}@rmm-demo-cache:6379/1
      SECRET_KEY: ${RMM_SECRET_KEY:-}
      JWT_SECRET_KEY: ${RMM_JWT_SECRET_KEY:-}
      ORG_REGISTRATION_TOKEN: ${RMM_ORG_TOKEN:-}
      SUPERADMIN_EMAIL: ${RMM_SUPERADMIN_EMAIL:-superadmin@rmm-demo.invalid}
      SUPERADMIN_PASSWORD: ${RMM_SUPERADMIN_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${RMM_DEMO_ADMIN_EMAIL:-admin@rmm-demo.test}
      SEED_ADMIN_PASSWORD: ${RMM_DEMO_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${DEMO_SCHEME:-https}://rmm.${DEMO_DOMAIN}
      DASHBOARD_URL: ${DEMO_SCHEME:-https}://rmm.${DEMO_DOMAIN}
      # The AI assistant is off unless you give a key AND switch it on (RMM_AI_ENABLED=1). Agentic tools and triage stay off either way.
      ANTHROPIC_API_KEY: ${RMM_ANTHROPIC_API_KEY:-}
      AI_ASSISTANT_ENABLED: ${RMM_AI_ENABLED:-0}
      AI_ASSISTANT_AGENTIC_ENABLED: "0"
      AI_TRIAGE_ENABLED: "0"
      # Behind the dashboard the API sees one proxy hop: the visitor address the dashboard forwards (sign-in lockout and audit log work per visitor).
      TRUSTED_PROXY_COUNT: "1"
      # The demo has no Celery worker, so build reports inside the request (otherwise Generate Report says success and makes no file).
      REPORTS_INLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [rmm_data, app_rmm, rmm_out]

  rmm-demo:
    profiles: ["apps"]
    build:
      context: ${APPS_ROOT:-../..}/RemoteManagementSystem
      dockerfile: ../${DASHBOARD_DIR:-ProjectsDashboard}/deploy/apps/rmm/Dockerfile.ui
    image: pd-rmm-ui
    container_name: pd-rmm-demo
    restart: unless-stopped
    <<: *demo-limits
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /app/static:rw,nosuid,uid=10001,gid=10001,size=8m
      - /home/app:rw,nosuid,uid=10001,gid=10001,size=32m
    depends_on:
      rmm-demo-api: { condition: service_healthy }
    environment:
      API_BASE_URL: http://rmm-demo-api:5000
      # Streamlit sits behind the demo gateway and Caddy, so it sees "visitor, caddy": the visitor is the 2nd entry from the right.
      DASHBOARD_TRUSTED_PROXY_COUNT: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [app_rmm]

  # CRM demo: its own Postgres (never shared with production) plus the app as a production build (see deploy/apps/crm/Dockerfile).
  crm-demo-db:
    profiles: ["apps"]
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=64m", "/var/run/postgresql:rw,nosuid,size=8m"]
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:-}
    volumes:
      - crm_demo_pgdata:/var/lib/postgresql/data
      - ./apps/crm/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [crm]

  # In-memory stand-in for the Upstash rate-limit store the CRM requires in production mode (a demo has one server).
  crm-demo-ratelimit:
    <<: *hardened
    profiles: ["apps"]
    image: projects-dashboard
    restart: unless-stopped
    command: ["node", "supervisor/redis-rest-stub.mjs", "8079"]
    environment:
      REDIS_STUB_BIND: 0.0.0.0
      REDIS_STUB_TOKEN: ${CRM_AUTH_SECRET:-}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8079/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
    networks: [crm]

  # One-off: applies the CRM's database migrations, creates the app's restricted logins, and (with "seed") wipes and refills the demo data.
  # It is the only place that holds the database OWNER's password; it runs, finishes, and crm-demo starts after it. deploy/reset-demos.sh
  # runs it with "seed". The image is built here and reused by crm-demo.
  crm-migrate:
    profiles: ["apps"]
    build:
      context: ${APPS_ROOT:-../..}/CRM
      dockerfile: ../${DASHBOARD_DIR:-ProjectsDashboard}/deploy/apps/crm/Dockerfile
    image: pd-crm
    restart: "no"
    command: ["migrate"]
    depends_on: { crm-demo-db: { condition: service_healthy } }
    environment:
      <<: *crm-env
      DATABASE_URL: postgresql://crm_app:${CRM_APP_PASSWORD:-}@crm-demo-db:5432/crm
      DIRECT_URL: postgresql://crm:${CRM_DB_PASSWORD:-}@crm-demo-db:5432/crm
      PLATFORM_DATABASE_URL: postgresql://crm:${CRM_DB_PASSWORD:-}@crm-demo-db:5432/crm   # the seed wipes tables: it needs the owner
      CRM_PLATFORM_PASSWORD: ${CRM_PLATFORM_PASSWORD:-}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    cpus: 2.0
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    networks: [crm]

  crm-demo:
    profiles: ["apps"]
    image: pd-crm
    container_name: pd-crm-demo
    restart: unless-stopped
    depends_on:
      crm-demo-db: { condition: service_healthy }
      crm-demo-ratelimit: { condition: service_started }
      crm-migrate: { condition: service_completed_successfully }
    environment:     # no email, Stripe, WhatsApp or AI keys: the demo never contacts an outside service
      <<: *crm-env
      # The running app holds NO owner credentials. DATABASE_URL is the login that row-level security binds. PLATFORM_DATABASE_URL (which
      # the app requires: sign-in, daily jobs and billing work that belong to no single business) is a separate login with row-level
      # security bypassed and table read/write rights only: it cannot change the schema or create roles. DIRECT_URL is only read by
      # "prisma migrate", which never runs here, so it points at the restricted login.
      DATABASE_URL: postgresql://crm_app:${CRM_APP_PASSWORD:-}@crm-demo-db:5432/crm
      DIRECT_URL: postgresql://crm_app:${CRM_APP_PASSWORD:-}@crm-demo-db:5432/crm
      PLATFORM_DATABASE_URL: postgresql://crm_platform:${CRM_PLATFORM_PASSWORD:-}@crm-demo-db:5432/crm
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    cpus: 2.0
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s
    networks: [app_crm, crm]

  # ClaudeWorkspace (CarRental) demo: customer site + admin portal from one image. The backend is a SEPARATE hosted
  # Supabase demo project (never the production one); payments, email, AI and monitoring keys are deliberately not set.
  claudeworkspace-web:
    profiles: ["apps"]
    build:
      context: ${APPS_ROOT:-../..}/ClaudeWorkspace/reci-transport
      dockerfile: ../../${DASHBOARD_DIR:-ProjectsDashboard}/deploy/apps/claudeworkspace/Dockerfile
      args:     # fixed into the production build: change DEMO_DOMAIN or the Supabase project and the image must be rebuilt
        NEXT_PUBLIC_SUPABASE_URL: ${CW_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${CW_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_APP_URL: ${DEMO_SCHEME:-https}://claudeworkspace.${DEMO_DOMAIN}
        NEXT_PUBLIC_ADMIN_URL: ${DEMO_SCHEME:-https}://claudeworkspace.${DEMO_DOMAIN}/admin
    image: pd-claudeworkspace
    container_name: pd-claudeworkspace-web
    restart: unless-stopped
    environment: &cw-env
      NEXT_PUBLIC_SUPABASE_URL: ${CW_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${CW_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${CW_SUPABASE_SERVICE_ROLE_KEY:-}
      NEXT_PUBLIC_APP_URL: ${DEMO_SCHEME:-https}://claudeworkspace.${DEMO_DOMAIN}
      NEXT_PUBLIC_ADMIN_URL: ${DEMO_SCHEME:-https}://claudeworkspace.${DEMO_DOMAIN}/admin
      INTERNAL_APP_URL: http://127.0.0.1:3102   # the vehicle page fetches its own API server-side; the public URL goes through the gateway and answers 401
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 120s
    networks: [app_cw]

  claudeworkspace-admin:
    profiles: ["apps"]
    image: pd-claudeworkspace
    container_name: pd-claudeworkspace-admin
    restart: unless-stopped
    depends_on: [claudeworkspace-web]       # same image, built once by the web service
    working_dir: /app/apps/admin
    command: ["pnpm", "exec", "next", "start", "-H", "0.0.0.0", "-p", "3103"]
    environment: *cw-env
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3103/admin').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 120s
    networks: [app_cw]

  # One-off: empties the ClaudeWorkspace demo's customer data (deploy/reset-demos.sh runs it; it is not part of `up`).
  cw-reset:
    <<: *hardened
    profiles: ["reset"]
    image: projects-dashboard
    command: ["node", "supervisor/reset-supabase-demo.mjs", "--env", "--yes"]
    environment:
      DEMO_PROJECT_REF: ${CW_DEMO_PROJECT_REF:-}
      NEXT_PUBLIC_SUPABASE_URL: ${CW_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${CW_SUPABASE_SERVICE_ROLE_KEY:-}
      ADMIN_EMAIL: ${CW_DEMO_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${CW_DEMO_ADMIN_PASSWORD:-}
      CUSTOMER_EMAIL: ${CW_DEMO_CUSTOMER_EMAIL:-}
      CUSTOMER_PASSWORD: ${CW_DEMO_CUSTOMER_PASSWORD:-}
    networks: [app_cw]

# Separate networks, so a compromised customer-facing demo can reach neither the dashboard's database, nor another demo, nor another demo's database:
#   edge          Caddy <-> gateway, console
#   db            the dashboard's Postgres <-> gateway, console. No outside access (internal); no demo container is on it.
#   app_<demo>    ONE network per demo: the gateway and the console (which probes health) plus that demo's own containers, nothing else.
#                 A demo cannot see the other demos. ImageApp, Airfinder and the CRM make no outbound calls, so their networks are
#                 internal (no route to the internet either). ClaudeWorkspace must reach Supabase and ClaudeOS must reach Anthropic, so app_cw and app_claudeos are not internal.
#   crm           the CRM demo's own Postgres and rate-limit stand-in <-> crm-demo only. No outside access.
# Adding a demo: give it its own app_<name> network here and add that network to the gateway and the console.
networks:
  edge:
    # Automatic addresses come from the upper half, so Caddy's pinned 172.30.0.2 can never be taken by another container.
    ipam: { config: [{ subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25 }] }
  db: { internal: true }
  app_imageapp: { internal: true }
  app_airfinder: { internal: true }
  app_claudeos: {}
  app_rmm: { internal: true }
  rmm_data: { internal: true }
  rmm_out: {}
  app_crm: { internal: true }
  app_cw: {}
  crm: { internal: true }

volumes:
  pgdata:
  db_backups:
  gateway_data:
  console_data:
  caddy_data:
  caddy_config:
  airfinder_demo_data:
  claudeos_demo_data:
  rmm_demo_pgdata:
  crm_demo_pgdata:
