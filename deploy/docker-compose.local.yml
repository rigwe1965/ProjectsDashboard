# Local test override: no domain, no HTTPS. Everything on http://*.localhost:8080
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   showcase  http://localhost:8080/        console  http://admin.localhost:8080/
#   demo link http://imageapp.demo.localhost:8080/d/<token>
# (*.localhost names resolve to this machine in modern browsers and in curl.)
services:
  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.local", "--adapter", "caddyfile"]
    ports: !override ["8080:80"]
  gateway:
    environment:
      DEMO_SCHEME: http
      DEMO_BASE_HOST: demo.localhost:8080
  console:
    environment:
      DEMO_SCHEME: http
      DEMO_BASE_HOST: demo.localhost:8080
      ADMIN_SCHEME: http
      ADMIN_ALLOW_HTTP: "1"   # plain HTTP is refused on a non-loopback address unless this is set; fine for a test on one machine, never for a real host
      ADMIN_REQUIRE_TOTP: "0"   # local test only: skip the 2-step requirement
      ADMIN_ALLOWED_HOSTS: admin.localhost,127.0.0.1
      ADMIN_PUBLIC_URL: http://admin.localhost:8080
  # App containers must also know the local public address (they build absolute URLs from it).
  airfinder-demo:
    environment:
      PUBLIC_BASE_URL: http://airfinder.demo.localhost:8080
  claudeos-demo:
    environment:
      ALLOWED_ORIGINS: http://claudeos.demo.localhost:8080
  crm-demo:
    environment:
      NEXTAUTH_URL: http://crm.demo.localhost:8080
      AUTH_URL: http://crm.demo.localhost:8080
  claudeworkspace-web:
    environment: &cw-local
      NEXT_PUBLIC_APP_URL: http://claudeworkspace.demo.localhost:8080
      NEXT_PUBLIC_ADMIN_URL: http://claudeworkspace.demo.localhost:8080/admin
  claudeworkspace-admin:
    environment: *cw-local
